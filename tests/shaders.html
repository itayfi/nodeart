<!doctype html><html><head><title>Nodeart shader verification</title></head><body><h1>Shader verification</h1><pre id="results">Checking…</pre><script type="module">
import {compile,makeNode,definitions,preset,presetNames,generateTexture} from '/src/engine.ts'
import {resolveGenerator} from '/src/graph.ts'
const gl=document.createElement('canvas').getContext('webgl'),results=[],wire=(source,target,input=0)=>({id:`${source}-${target}`,source,target,targetHandle:String(input)});
const sources=Object.keys(definitions).map(kind=>{const a=makeNode(kind,'a',0,0),out=makeNode('output','out',250,0);if(['affine','ifsset','tile','tileset'].includes(kind)){const generator=makeNode(['affine','ifsset'].includes(kind)?'ifs':'wfc','generator',0,0);return{name:kind,...compile([a,generator,out],[wire('a','generator',1),wire('generator','out')])}}return{name:kind,...compile(kind==='output'?[a]:[a,out],kind==='output'?[]:[wire('a','out')])}});
for(let i=0;i<presetNames.length;i++){const graph=preset(i);sources.push({name:`Preset ${i}`,...compile(graph.nodes,graph.edges)})}
for(const item of sources){const program=gl.createProgram();let failure='';for(const [type,source] of [[gl.VERTEX_SHADER,'attribute vec2 aPosition; varying vec2 vUv; void main(){vUv=aPosition*.5+.5;gl_Position=vec4(aPosition,0.,1.);}'],[gl.FRAGMENT_SHADER,item.source]]){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))failure+=gl.getShaderInfoLog(shader);gl.attachShader(program,shader);gl.deleteShader(shader)}gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))failure+=gl.getProgramInfoLog(program);results.push(`${failure?'FAIL':'PASS'} ${item.name}${failure?'\n'+failure:''}`);gl.deleteProgram(program)}
for(const index of [3,4]){const graph=preset(index),node=graph.nodes.find(n=>n.id==='generator');try{const image=generateTexture(node,resolveGenerator(node,graph.nodes,graph.edges,0)),pixels=image.getContext('2d').getImageData(0,0,512,512).data;let lo=255,hi=0;for(let i=0;i<pixels.length;i+=4){lo=Math.min(lo,pixels[i]);hi=Math.max(hi,pixels[i])}results.push(`${hi-lo>20?'PASS':'FAIL'} custom ${index===3?'IFS':'WFC'} texture has varying pixels`)}catch(e){results.push(`FAIL custom texture: ${e.message}`)}}
document.querySelector('#results').textContent=results.join('\n')
</script><script type="module" src="/tests/rendering.ts"></script></body></html>
